<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인공지능</title>
  <style>
    body {
      margin: 0;
      background: #f7f8f8;
      color: #172326;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }
    main {
      width: min(100% - 32px, 980px);
      margin: 0 auto;
      padding: 32px 0 56px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 2rem;
    }
    .page {
      margin: 0 0 24px;
      padding: 14px;
      border: 1px solid #dbe4e4;
      border-radius: 10px;
      background: #fff;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      margin-top: 10px;
      color: #66777b;
      text-align: right;
    }
  </style>
</head>
<body>
  <main>
    <h1>인공지능</h1>
    
    <figure class="page">
      <img src="./page-001.webp" alt="인공지능 1페이지">
      <figcaption>1 / 5 페이지</figcaption>
    </figure>
    

    <figure class="page">
      <img src="./page-002.webp" alt="인공지능 2페이지">
      <figcaption>2 / 5 페이지</figcaption>
    </figure>
    

    <figure class="page">
      <img src="./page-003.webp" alt="인공지능 3페이지">
      <figcaption>3 / 5 페이지</figcaption>
    </figure>
    

    <figure class="page">
      <img src="./page-004.webp" alt="인공지능 4페이지">
      <figcaption>4 / 5 페이지</figcaption>
    </figure>
    

    <figure class="page">
      <img src="./page-005.webp" alt="인공지능 5페이지">
      <figcaption>5 / 5 페이지</figcaption>
    </figure>
    
  </main>
</body>
</html>
