<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>과목 자료 보기</title>
  <meta
    name="description"
    content="과목별 PDF 자료를 웹에서 바로 확인하는 페이지입니다."
  >
  <link rel="stylesheet" href="./styles.css?v=20260325-02">
</head>
<body class="page-shell">
  <div class="background-glow background-glow-left"></div>
  <div class="background-glow background-glow-right"></div>

  <main class="layout course-layout">
    <a class="back-link" href="./index.html">학기 목록으로 돌아가기</a>

    <section id="course-status" class="status-message" aria-live="polite">
      과목 자료를 불러오는 중입니다.
    </section>

    <article id="course-view" class="course-view" hidden>
      <header class="course-header">
        <nav class="breadcrumb" aria-label="breadcrumb">
          <a href="./index.html">홈</a>
          <span aria-hidden="true">/</span>
          <span id="breadcrumb-semester"></span>
          <span aria-hidden="true">/</span>
          <span id="breadcrumb-title"></span>
        </nav>

        <div class="course-title-wrap">
          <p id="course-semester" class="eyebrow"></p>
          <h1 id="course-title"></h1>
          <p id="course-notes" class="course-notes" hidden></p>
        </div>

        <div class="course-actions">
          <a id="open-pdf-link" class="button button-primary" target="_blank" rel="noreferrer">새 탭에서 열기</a>
          <a id="download-pdf-link" class="button button-secondary" download>PDF 다운로드</a>
        </div>
      </header>

      <section class="viewer-card">
        <div class="view-switch" role="tablist" aria-label="보기 모드">
          <button
            id="html-tab"
            type="button"
            class="view-tab"
            data-view-tab="html"
            role="tab"
            aria-selected="false"
          >
            HTML 보기
          </button>
          <button
            id="pdf-tab"
            type="button"
            class="view-tab is-active"
            data-view-tab="pdf"
            role="tab"
            aria-selected="true"
          >
            PDF 보기
          </button>
        </div>

        <div id="viewer-tip" class="viewer-tip">
          브라우저에서 PDF가 보이지 않으면 위 버튼으로 새 탭 열기 또는 다운로드를 사용하세요.
        </div>

        <div id="pdf-panel" class="viewer-panel">
          <iframe id="pdf-frame" class="pdf-frame" title="과목 PDF 뷰어"></iframe>
        </div>

        <div id="html-panel" class="viewer-panel" hidden>
          <div class="html-view-header">
            <p class="html-view-title">HTML 보기</p>
            <p class="html-view-copy">
              PDF 각 페이지를 이미지로 변환해 원본 배치와 시각 구성을 최대한 그대로 유지한 보기입니다.
            </p>
          </div>
          <section class="search-panel" aria-label="문서 검색">
            <div class="search-toolbar">
              <label class="search-field" for="html-search-input">
                <span class="search-label">문서 검색</span>
                <input
                  id="html-search-input"
                  class="search-input"
                  type="search"
                  placeholder="HTML 보기에서 찾을 단어를 입력하세요"
                  autocomplete="off"
                >
              </label>
              <div class="search-controls">
                <button id="search-prev" type="button" class="search-button">이전</button>
                <button id="search-next" type="button" class="search-button">다음</button>
                <button id="search-clear" type="button" class="search-button search-button-muted">지우기</button>
              </div>
            </div>
            <div class="search-meta">
              <p id="search-status" class="search-status">Ctrl+F를 누르면 이 검색창으로 바로 이동합니다.</p>
            </div>
          </section>
          <div id="html-pages" class="html-pages"></div>
        </div>
      </section>
    </article>
  </main>

  <script type="module" src="./js/course.js?v=20260325-02"></script>
</body>
</html>
