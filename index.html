<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>학습 기록 아카이브</title>
  <meta
    name="description"
    content="학교에서 학습한 과목 자료를 학기별로 정리한 PDF 기반 아카이브입니다."
  >
  <link rel="stylesheet" href="./styles.css?v=20260325-02">
</head>
<body class="page-shell">
  <div class="background-glow background-glow-left"></div>
  <div class="background-glow background-glow-right"></div>

  <main class="layout">
    <section class="hero-card">
      <p class="eyebrow">Study Record Upload Project</p>
      <h1>학습 기록 아카이브</h1>
      <p class="hero-copy">
        학교에서 수강한 과목 정리본을 학기별로 정리해 두는 PDF 중심 웹 아카이브입니다.
        원본 문서를 최대한 유지하면서 필요할 때 바로 찾아볼 수 있도록 구성했습니다.
      </p>
      <div class="hero-meta">
        <div>
          <span class="meta-label">운영 방식</span>
          <strong>정적 웹사이트 / GitHub Pages</strong>
        </div>
        <div>
          <span class="meta-label">표시 기준</span>
          <strong>원본 PDF 우선</strong>
        </div>
      </div>
    </section>

    <section class="archive-panel">
      <div class="section-heading">
        <div>
          <p class="section-kicker">Archive Tree</p>
          <h2>학기별 자료</h2>
        </div>
        <p class="section-description">
          1학년 1학기부터 3학년 2학기까지의 자료를 학기별로 분류합니다.
        </p>
      </div>

      <div id="status-message" class="status-message" aria-live="polite">
        자료 목록을 불러오는 중입니다.
      </div>

      <div id="semester-tree" class="year-grid" hidden></div>
    </section>
  </main>

  <script type="module" src="./js/index.js?v=20260325-02"></script>
</body>
</html>
